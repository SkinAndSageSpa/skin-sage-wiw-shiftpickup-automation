name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backfill missed open-shift task (Katie Bennett, 3808897211)
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_PROJECT_GID:  ${{ secrets.ASANA_PROJECT_GID }}
        run: |
          node - << 'JS'
          const wiw   = require('./src/wiwClient');
          const asana = require('./src/asanaClient');
          (async () => {
            await wiw.login();
            const shift = await wiw.getShift(3808897211);
            const user  = await wiw.getUser(shift.user_id);
            if (!wiw.isProvider(user)) throw new Error('Not a provider — aborting');

            const name     = `${user.first_name} ${user.last_name}`;
            const position = wiw.positionLabel(user);
            const shiftDate    = wiw.shiftDateKey(shift);
            const shiftDisplay = `${wiw.formatShiftDate(shift)} ${wiw.formatShiftTime(shift)}`;
            const hours        = wiw.shiftHours(shift);

            const shiftsToday  = await wiw.getUserShiftsOnDate(shift.user_id, shiftDate);
            const isBackToBack = shiftsToday.length >= 2;
            const isUrgent     = (new Date(shift.start_time) - Date.now()) < 24 * 60 * 60 * 1000;
            const assigneeGid  = asana.pickAssignee(isUrgent);

            console.log(`Backfilling: ${name} (${position}), ${shiftDisplay} (${hours} hrs), backToBack=${isBackToBack}, urgent=${isUrgent}`);

            const task = await asana.createOpenShiftTask({
              provider: { name, position },
              shiftDate,
              shiftDisplay,
              shiftHours: hours,
              isBackToBack,
              assigneeGid,
              now: new Date(),
            });
            console.log(task ? `Created: ${task?.data?.permalink_url || JSON.stringify(task)}` : 'Skipped (already exists)');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
