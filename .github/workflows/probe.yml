name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          const wiw = require('./src/wiwClient');
          (async () => {
            await wiw.login();
            const shifts = await wiw.getLocationShifts();
            const target = shifts.filter(s => wiw.shiftDateKey(s) === '2026-07-29');
            console.log(`Shifts on 2026-07-29: ${target.length}`);
            for (const s of target) {
              const label = s.user_id ? `user_id=${s.user_id}` : 'UNASSIGNED';
              console.log(`  id=${s.id}  ${wiw.formatShiftTime(s)}  position_id=${s.position_id}  ${label}`);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
