name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          const wiw = require('./src/wiwClient');
          (async () => {
            await wiw.login();
            const shift = await wiw.getShift(3808897198);
            const user  = await wiw.getUser(shift.user_id);
            console.log(`shift ${shift.id}: user_id=${shift.user_id} name=${user.first_name} ${user.last_name}`);
            console.log(`  ${wiw.formatShiftDate(shift)} ${wiw.formatShiftTime(shift)}  isProvider=${wiw.isProvider(user)}  position=${wiw.positionLabel(user)}`);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
