name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          const wiw = require('./src/wiwClient');
          (async () => {
            await wiw.login();
            const shifts = await wiw.getLocationShifts();
            console.log(`getLocationShifts() total (60-day window): ${shifts.length}`);
            for (const dateKey of ['2026-07-11', '2026-07-12']) {
              const onDate = shifts.filter(s => wiw.shiftDateKey(s) === dateKey);
              const open   = onDate.filter(s => !s.user_id || s.user_id === 0);
              console.log(`\n${dateKey}: ${onDate.length} total shift(s) returned, ${open.length} open`);
              for (const s of onDate) {
                console.log(`  id=${s.id}  user_id=${s.user_id || 0}  ${wiw.formatShiftTime(s)}  position_id=${s.position_id}`);
              }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
