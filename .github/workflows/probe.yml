name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          (async () => {
            const loginRes = await fetch('https://api.login.wheniwork.com/login', {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const loginData = await loginRes.json();
            const token = loginData.token || loginData.session_token || loginData?.person?.token || loginData?.user?.token;
            if (!token) { console.error('No token:', JSON.stringify(loginData)); process.exit(1); }

            const variants = [
              '/shifts?start=2026-07-12&end=2026-07-13&location_id=5837840&include_open=true',
              '/shifts?start=2026-07-12&end=2026-07-13&location_id=5838148&include_open=true',
              '/shifts?start=2026-07-12&end=2026-07-13&location_id=5846641&include_open=true',
            ];

            for (const path of variants) {
              try {
                const res = await fetch(`https://api.wheniwork.com/2${path}`, {
                  headers: { 'W-Token': token, 'Content-Type': 'application/json' },
                });
                const bodyText = await res.text();
                console.log(`\n=== ${path} -> HTTP ${res.status} ===`);
                console.log(`raw length: ${bodyText.length}`);
                try {
                  const parsed = JSON.parse(bodyText);
                  console.log(`top-level keys: ${JSON.stringify(Object.keys(parsed))}`);
                  console.log(`shifts.length: ${(parsed.shifts||[]).length}`);
                  console.log(`is_open values seen: ${JSON.stringify((parsed.shifts||[]).map(s => s.is_open))}`);
                  console.log(`meta/pagination: ${JSON.stringify(parsed.meta || parsed.pagination || parsed.total || 'none')}`);
                } catch (e) { console.log(`parse-error: ${bodyText.slice(0,300)}`); }
              } catch (err) {
                console.log(`${path} -> ERROR ${err.message}`);
              }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
