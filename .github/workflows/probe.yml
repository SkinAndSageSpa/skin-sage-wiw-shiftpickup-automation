name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WIW shift for Priscilla / 7-20
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          async function main() {
            const loginRes = await fetch('https://api.login.wheniwork.com/login', {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const loginData = await loginRes.json();
            const token = loginData.token;
            const headers = { 'W-Token': token, 'Content-Type': 'application/json' };

            const uRes = await fetch('https://api.wheniwork.com/2/users', { headers });
            const { users } = await uRes.json();
            const priscilla = (users || []).find(u => /priscilla/i.test(u.first_name) && /barajas/i.test(u.last_name));
            console.log('=== USER ===');
            console.log(priscilla ? JSON.stringify(priscilla, null, 2) : '  NOT FOUND');

            const accRes = await fetch('https://api.wheniwork.com/2/accounts', { headers });
            console.log('\n=== ACCOUNTS ===');
            console.log(JSON.stringify(await accRes.json(), null, 2));

            // Reproduce the EXACT production query (today -> +60 days) and check for pagination/limit truncation.
            const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
            const end60 = new Date(Date.now() + 60 * 86400000).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
            const prodUrl = `https://api.wheniwork.com/2/shifts?start=${today}&end=${end60}&include_open=true`;
            const prodRes = await fetch(prodUrl, { headers });
            console.log(`\n=== PRODUCTION QUERY: ${prodUrl} ===`);
            console.log('Response headers:');
            for (const [k, v] of prodRes.headers.entries()) console.log(`  ${k}: ${v}`);
            const prodData = await prodRes.json();
            console.log('Top-level response keys:', Object.keys(prodData));
            if (prodData.meta) console.log('meta:', JSON.stringify(prodData.meta));
            console.log(`shifts.length = ${(prodData.shifts || []).length}`);
            const target = (prodData.shifts || []).find(s => s.id === 3804713705);
            console.log(`Target shift 3804713705 present in production-query result: ${!!target}`);
            if (target) console.log(JSON.stringify(target, null, 2));

            // Sanity check: does a single-day query for 07-20 alone return it?
            const singleDay = await fetch('https://api.wheniwork.com/2/shifts?start=2026-07-20&end=2026-07-20&include_open=true', { headers });
            const singleDayData = await singleDay.json();
            console.log(`\nSingle-day (2026-07-20) query shifts.length = ${(singleDayData.shifts||[]).length}`);
            console.log(`Target present in single-day query: ${!!(singleDayData.shifts||[]).find(s => s.id === 3804713705)}`);

            // Try end+1 (exclusive end theory) and a shifted narrower window to test for a hard page cap.
            const singleDayPlus1 = await fetch('https://api.wheniwork.com/2/shifts?start=2026-07-20&end=2026-07-21&include_open=true', { headers });
            const singleDayPlus1Data = await singleDayPlus1.json();
            console.log(`\nstart=07-20&end=07-21 shifts.length = ${(singleDayPlus1Data.shifts||[]).length}, target present: ${!!(singleDayPlus1Data.shifts||[]).find(s => s.id === 3804713705)}`);

            const page2 = await fetch('https://api.wheniwork.com/2/shifts?start=2026-07-01&end=2026-08-30&include_open=true&page=2', { headers });
            const page2Data = await page2.json();
            console.log(`\npage=2 shifts.length = ${(page2Data.shifts||[]).length}`);

            const narrower = await fetch('https://api.wheniwork.com/2/shifts?start=2026-07-15&end=2026-07-25&include_open=true', { headers });
            const narrowerData = await narrower.json();
            console.log(`\nstart=07-15&end=07-25 shifts.length = ${(narrowerData.shifts||[]).length}, target present: ${!!(narrowerData.shifts||[]).find(s => s.id === 3804713705)}`);

            // What does production's actual window (today -> +60d) look like broken into halves?
            const half1 = await fetch(`https://api.wheniwork.com/2/shifts?start=${today}&end=2026-07-19&include_open=true`, { headers });
            const half1Data = await half1.json();
            console.log(`\n${today} -> 2026-07-19 shifts.length = ${(half1Data.shifts||[]).length}`);
            const half2 = await fetch(`https://api.wheniwork.com/2/shifts?start=2026-07-19&end=${end60}&include_open=true`, { headers });
            const half2Data = await half2.json();
            console.log(`2026-07-19 -> ${end60} shifts.length = ${(half2Data.shifts||[]).length}, target present: ${!!(half2Data.shifts||[]).find(s => s.id === 3804713705)}`);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JS
