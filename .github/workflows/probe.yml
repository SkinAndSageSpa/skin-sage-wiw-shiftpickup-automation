name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          const wiw = require('./src/wiwClient');
          (async () => {
            await wiw.login();
            const ids = [3808896259,3808897193,3808897198,3808897211,3808897218,3808896258,3808897172,3808897175,3808897179,3808897183,3808897188,3808896257,3808897162,3808897167,3808897307,3808897313];
            for (const id of ids) {
              const shift = await wiw.getShift(id);
              const user  = await wiw.getUser(shift.user_id);
              console.log(`shift ${id}: ${user.first_name} ${user.last_name}  ${wiw.formatShiftTime(shift)}`);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
