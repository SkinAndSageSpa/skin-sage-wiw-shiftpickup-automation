name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WIW positions and locations
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          async function main() {
            const loginRes = await fetch('https://api.login.wheniwork.com/login', {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const { token } = await loginRes.json();
            const headers = { 'W-Token': token, 'Content-Type': 'application/json' };

            const [posRes, locRes] = await Promise.all([
              fetch('https://api.wheniwork.com/2/positions', { headers }),
              fetch('https://api.wheniwork.com/2/locations', { headers }),
            ]);
            const { positions } = await posRes.json();
            const { locations } = await locRes.json();

            console.log('\n=== POSITIONS ===');
            for (const p of positions || []) console.log(`  ${p.id}: ${p.name}`);
            console.log('\n=== LOCATIONS ===');
            for (const l of locations || []) console.log(`  ${l.id}: ${l.name}`);
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JS
