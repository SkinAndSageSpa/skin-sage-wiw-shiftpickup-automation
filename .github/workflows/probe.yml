name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe WIW account state
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          (async () => {
            const loginRes = await fetch('https://api.login.wheniwork.com/login', {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const loginData = await loginRes.json();
            const token = loginData.token || loginData.session_token || loginData?.person?.token || loginData?.user?.token;
            if (!token) { console.error('No token:', JSON.stringify(loginData)); process.exit(1); }

            const variants = [
              '/locations',
              '/shifts/3796097400',
            ];

            for (const path of variants) {
              try {
                const res = await fetch(`https://api.wheniwork.com/2${path}`, {
                  headers: { 'W-Token': token, 'Content-Type': 'application/json' },
                });
                const bodyText = await res.text();
                console.log(`\n=== ${path} -> HTTP ${res.status} ===`);
                console.log(bodyText.slice(0, 3000));
              } catch (err) {
                console.log(`${path} -> ERROR ${err.message}`);
              }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
