name: WIW Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WIW shift for Priscilla / 7-20
        env:
          WIW_API_KEY: ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:   ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node - << 'JS'
          async function main() {
            const loginRes = await fetch('https://api.login.wheniwork.com/login', {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const loginData = await loginRes.json();
            const token = loginData.token;
            const headers = { 'W-Token': token, 'Content-Type': 'application/json' };

            const uRes = await fetch('https://api.wheniwork.com/2/users', { headers });
            const { users } = await uRes.json();
            const priscilla = (users || []).find(u => /priscilla/i.test(u.first_name) && /barajas/i.test(u.last_name));
            console.log('=== USER ===');
            console.log(priscilla ? JSON.stringify(priscilla, null, 2) : '  NOT FOUND');

            const accRes = await fetch('https://api.wheniwork.com/2/accounts', { headers });
            console.log('\n=== ACCOUNTS ===');
            console.log(JSON.stringify(await accRes.json(), null, 2));

            const wide = await fetch(`https://api.wheniwork.com/2/shifts?start=2026-07-01&end=2026-07-31&user_id=${priscilla.id}`, { headers });
            const wideData = await wide.json();
            console.log(`\n=== Priscilla shifts July 2026, no include_open (${(wideData.shifts||[]).length}) ===`);
            for (const s of wideData.shifts || []) {
              console.log(JSON.stringify({ id: s.id, user_id: s.user_id, is_open: s.is_open, start_time: s.start_time, location_id: s.location_id }));
            }

            const wide2 = await fetch(`https://api.wheniwork.com/2/shifts?start=2026-07-01&end=2026-07-31&include_open=true`, { headers });
            const wide2Data = await wide2.json();
            console.log(`\n=== ALL shifts July 2026, include_open=true (${(wide2Data.shifts||[]).length}) ===`);
            const on20 = (wide2Data.shifts || []).filter(s => (s.start_time||'').includes('2026-07-20'));
            console.log(`  -> of which on 07-20: ${on20.length}`);
            for (const s of on20) {
              console.log(JSON.stringify({ id: s.id, user_id: s.user_id, is_open: s.is_open, openshift_approval_request_id: s.openshift_approval_request_id, location_id: s.location_id, start_time: s.start_time, end_time: s.end_time, created_at: s.created_at, updated_at: s.updated_at }));
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JS
