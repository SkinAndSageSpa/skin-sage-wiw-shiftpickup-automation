name: WIW Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check recently reassigned shifts
        env:
          WIW_API_KEY:  ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:    ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node << 'SCRIPT'
          const LOGIN_URL = 'https://api.login.wheniwork.com/login';
          const API = 'https://api.wheniwork.com/2';
          const TZ = 'America/Los_Angeles';
          const LOC = 5837840;

          async function main() {
            const loginRes = await fetch(LOGIN_URL, {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const loginData = await loginRes.json();
            const token = loginData.token || loginData.session_token;
            if (!token) { console.error('Login failed'); process.exit(1); }

            const headers = { 'W-Token': token, 'Content-Type': 'application/json' };
            const get = async (path) => {
              const r = await fetch(`${API}${path}`, { headers });
              return r.json();
            };

            const past60 = new Date(Date.now() - 60*86400000).toLocaleDateString('en-CA', { timeZone: TZ });
            const fut60  = new Date(Date.now() + 60*86400000).toLocaleDateString('en-CA', { timeZone: TZ });

            // Fetch all shifts at location over the window
            const data = await get(`/shifts?start=${past60}&end=${fut60}&location_id=${LOC}`);
            const shifts = data.shifts || [];
            console.log(`Total shifts fetched: ${shifts.length}`);

            // Sort by updated_at descending — most recently touched first
            shifts.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            // Show top 20 most recently updated assigned shifts
            console.log('\n--- 20 most recently updated ASSIGNED shifts ---');
            const assigned = shifts.filter(s => s.user_id && s.user_id !== 0);
            assigned.slice(0, 20).forEach(s => {
              const createdAt = new Date(s.created_at);
              const updatedAt = new Date(s.updated_at);
              const diffMs    = updatedAt - createdAt;
              const diffMins  = Math.round(diffMs / 60000);
              // Flag shifts where updated_at is significantly later than created_at
              // (suggests a reassignment happened post-creation)
              const flag = diffMins > 30 ? ' *** UPDATED AFTER CREATE' : '';
              console.log(
                `id=${s.id} user_id=${s.user_id} start=${s.start_time}` +
                `\n  created=${s.created_at}` +
                `\n  updated=${s.updated_at} (${diffMins}min after create)${flag}` +
                `\n  osar_id=${s.openshift_approval_request_id} published=${s.is_published} acknowledged=${s.is_acknowledged}`
              );
            });

            // Specifically look at shifts updated significantly after creation
            // These are strong candidates for reassignments
            const likelyReassigned = assigned.filter(s => {
              const diff = new Date(s.updated_at) - new Date(s.created_at);
              return diff > 30 * 60 * 1000; // >30 min gap
            });
            console.log(`\n--- Shifts updated >30min after creation (likely reassigned): ${likelyReassigned.length} ---`);
            likelyReassigned
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .slice(0, 10)
              .forEach(s => {
                const diffHrs = ((new Date(s.updated_at) - new Date(s.created_at)) / 3600000).toFixed(1);
                console.log(
                  `id=${s.id} user_id=${s.user_id} start=${s.start_time}` +
                  `\n  created=${s.created_at} | updated=${s.updated_at} (+${diffHrs}h)` +
                  `\n  osar_id=${s.openshift_approval_request_id}`
                );
              });

            // Also fetch users so we can resolve names for a few key shifts
            const usersData = await get('/users?location_id=' + LOC);
            const users = {};
            (usersData.users || []).forEach(u => { users[u.id] = `${u.first_name} ${u.last_name}`; });

            console.log('\n--- User map (id → name) ---');
            Object.entries(users).forEach(([id, name]) => console.log(`  ${id}: ${name}`));

            // Resolve names on top reassigned shifts
            console.log('\n--- Top reassigned shifts with resolved names ---');
            likelyReassigned
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .slice(0, 5)
              .forEach(s => {
                const diffHrs = ((new Date(s.updated_at) - new Date(s.created_at)) / 3600000).toFixed(1);
                console.log(
                  `${users[s.user_id] || s.user_id}: shift on ${s.start_time}` +
                  ` | created=${s.created_at} updated=${s.updated_at} (+${diffHrs}h)`
                );
              });
          }

          main().catch(e => { console.error(e); process.exit(1); });
          SCRIPT
