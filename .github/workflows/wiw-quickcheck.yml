name: WIW Quick Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Priscilla June 22
        env:
          WIW_API_KEY:  ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:    ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          cat > /tmp/check.mjs << 'EOF'
          const LOGIN_URL = 'https://api.login.wheniwork.com/login';
          const API = 'https://api.wheniwork.com/2';
          const PRISCILLA_ID = 52119785;
          const lr = await fetch(LOGIN_URL, {
            method: 'POST',
            headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
          });
          const { token } = await lr.json();
          const h = { 'W-Token': token, 'Content-Type': 'application/json' };
          const r1 = await fetch(`${API}/shifts?start=2026-06-22&end=2026-06-22&user_id=${PRISCILLA_ID}`, { headers: h });
          const d1 = await r1.json();
          console.log('Priscilla June 22 (no loc filter):', (d1.shifts||[]).length);
          for (const s of (d1.shifts||[])) {
            console.log(`  id=${s.id} loc=${s.location_id} start=${s.start_time} osar=${s.openshift_approval_request_id} updated=${s.updated_at}`);
          }
          const r2 = await fetch(`${API}/shifts?start=2026-06-08&end=2026-08-08`, { headers: h });
          const d2 = await r2.json();
          const withOsar = (d2.shifts||[]).filter(s => s.openshift_approval_request_id > 0);
          console.log('osar>0 (no loc filter, next 60d):', withOsar.length);
          for (const s of withOsar) {
            const recent = new Date(s.updated_at) >= new Date(Date.now() - 90*60*1000);
            console.log(`  id=${s.id} user=${s.user_id} loc=${s.location_id} start=${s.start_time} osar=${s.openshift_approval_request_id} updated=${s.updated_at} recent=${recent}`);
          }
          EOF
          node --input-type=module < /tmp/check.mjs
