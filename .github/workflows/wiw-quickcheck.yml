name: WIW Quick Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Priscilla June 22 - no location filter
        env:
          WIW_API_KEY:  ${{ secrets.WIW_API_KEY }}
          WIW_EMAIL:    ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
        run: |
          node << 'SCRIPT'
          const LOGIN_URL = 'https://api.login.wheniwork.com/login';
          const API = 'https://api.wheniwork.com/2';
          const PRISCILLA_ID = 52119785;
          async function main() {
            const lr = await fetch(LOGIN_URL, {
              method: 'POST',
              headers: { 'W-Key': process.env.WIW_API_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: process.env.WIW_EMAIL, password: process.env.WIW_PASSWORD }),
            });
            const { token } = await lr.json();
            const h = { 'W-Token': token, 'Content-Type': 'application/json' };

            // No location filter
            const r1 = await fetch(`${API}/shifts?start=2026-06-22&end=2026-06-22&user_id=${PRISCILLA_ID}`, { headers: h });
            const d1 = await r1.json();
            console.log('Priscilla June 22 (no location filter):', (d1.shifts||[]).length);
            (d1.shifts||[]).forEach(s => console.log(
              `  id=${s.id} location_id=${s.location_id} start=${s.start_time} end=${s.end_time}` +
              `  osar_id=${s.openshift_approval_request_id} updated=${s.updated_at}`
            ));

            // Check open shift approval requests directly
            const r2 = await fetch(`${API}/openshiftapprovalrequests?start=2026-06-01&end=2026-08-08`, { headers: h });
            const d2 = await r2.json();
            console.log('
Open shift approval requests:', JSON.stringify(d2).slice(0,500));

            // Also check all osar>0 with no location filter
            const r3 = await fetch(`${API}/shifts?start=2026-06-08&end=2026-08-08`, { headers: h });
            const d3 = await r3.json();
            const withOsar = (d3.shifts||[]).filter(s => s.openshift_approval_request_id > 0);
            console.log('
osar_id>0 shifts (no location filter, next 60d):', withOsar.length);
            withOsar.forEach(s => console.log(
              `  id=${s.id} user_id=${s.user_id} location_id=${s.location_id} start=${s.start_time} osar_id=${s.openshift_approval_request_id} updated=${s.updated_at}`
            ));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          SCRIPT
